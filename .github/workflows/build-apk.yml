name: Build Android APKs

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Which APK to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - client only
          - server only
      build_note:
        description: 'Optional build note'
        required: false
        default: ''

jobs:
  build-client-apk:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true ||
      github.event_name == 'workflow_dispatch' && (
        inputs.build_target == 'both' ||
        inputs.build_target == 'client only'
      )
    defaults:
      run:
        working-directory: src/PcIfy.Client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-client-${{ hashFiles('src/PcIfy.Client/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-client-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Android binary files
        run: flutter create --org com.pcify --project-name pcify_client --platforms=android .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks || { echo "base64 decode failed"; exit 1; }
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "No keystore secret set — using debug signing."
          fi

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pcify-client-arm64-${{ github.run_number }}
          path: src/PcIfy.Client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

  build-server-apk:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true ||
      github.event_name == 'workflow_dispatch' && (
        inputs.build_target == 'both' ||
        inputs.build_target == 'server only'
      )
    defaults:
      run:
        working-directory: src/PcIfy.Server.Flutter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-server-${{ hashFiles('src/PcIfy.Server.Flutter/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-server-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Android binary files
        run: flutter create --org com.pcify --project-name pcify_server --platforms=android .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks || { echo "base64 decode failed"; exit 1; }
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "No keystore secret set — using debug signing."
          fi

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pcify-server-arm64-${{ github.run_number }}
          path: src/PcIfy.Server.Flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
