name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'src/PcIfy.Client.Flutter/**'
  workflow_dispatch:
    inputs:
      build_note:
        description: 'Optional build note'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/PcIfy.Client.Flutter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Android binary files
        # gradle-wrapper.jar and launcher PNGs cannot be stored as text in git;
        # flutter create recreates them without overwriting existing config files.
        run: flutter create --org com.pcify --project-name pcify_client --platforms=android .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pcify-arm64-${{ github.run_number }}
          path: src/PcIfy.Client.Flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload universal APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: pcify-all-${{ github.run_number }}
          path: src/PcIfy.Client.Flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
        continue-on-error: true
