name: Build Android APKs

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'src/PcIfy.Client/**'
      - 'src/PcIfy.Server.Flutter/**'
  workflow_dispatch:
    inputs:
      build_note:
        description: 'Optional build note'
        required: false
        default: ''

# Opt into Node.js 24 now to suppress the Node.js 20 deprecation warning.
# GitHub Actions will force Node.js 24 by default from June 16, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-client-apk:
    runs-on: ubuntu-latest
    # No per-job 'if' condition — the workflow-level path filter above already
    # controls when this file runs. Per-job conditions using
    # github.event.commits[0].modified only see modified files, not newly
    # added ones, causing jobs to be incorrectly skipped on first push.
    defaults:
      run:
        working-directory: src/PcIfy.Client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-client-${{ hashFiles('src/PcIfy.Client/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-client-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Android binary files
        run: flutter create --org com.pcify --project-name pcify_client --platforms=android .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pcify-client-arm64-${{ github.run_number }}
          path: src/PcIfy.Client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload universal APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: pcify-client-all-${{ github.run_number }}
          path: src/PcIfy.Client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
        continue-on-error: true

  build-server-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/PcIfy.Server.Flutter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-server-${{ hashFiles('src/PcIfy.Server.Flutter/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-server-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Android binary files
        run: flutter create --org com.pcify --project-name pcify_server --platforms=android .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pcify-server-arm64-${{ github.run_number }}
          path: src/PcIfy.Server.Flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload universal APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: pcify-server-all-${{ github.run_number }}
          path: src/PcIfy.Server.Flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
        continue-on-error: true
