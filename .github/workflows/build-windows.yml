name: Build Windows Executables

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Which Windows build to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - client only
          - server only

jobs:
  build-windows-client:
    runs-on: windows-latest
    if: >
      github.event.pull_request.merged == true ||
      github.event_name == 'workflow_dispatch' && (
        inputs.build_target == 'both' ||
        inputs.build_target == 'client only'
      )
    defaults:
      run:
        working-directory: src/PcIfy.Client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-win-client-${{ hashFiles('src/PcIfy.Client/pubspec.lock') }}
          restore-keys: pub-win-client-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Windows runner files
        run: flutter create --org com.pcify --project-name pcify_client --platforms=windows .

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath pcify-client-windows.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcify-client-windows-zip-${{ github.run_number }}
          path: src/PcIfy.Client/pcify-client-windows.zip
          retention-days: 30

      # Inno Setup installer — only produced on merges to main (saves CI minutes)
      - name: Install Inno Setup
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: iscc windows\installer.iss

      - name: Upload installer artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pcify-client-windows-installer-${{ github.run_number }}
          path: src/PcIfy.Client/Output/pcify-client-setup.exe
          retention-days: 30

  build-windows-server:
    runs-on: windows-latest
    if: >
      github.event.pull_request.merged == true ||
      github.event_name == 'workflow_dispatch' && (
        inputs.build_target == 'both' ||
        inputs.build_target == 'server only'
      )
    defaults:
      run:
        working-directory: src/PcIfy.Server.Flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-win-server-${{ hashFiles('src/PcIfy.Server.Flutter/pubspec.lock') }}
          restore-keys: pub-win-server-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Windows runner files
        run: flutter create --org com.pcify --project-name pcify_server --platforms=windows .

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath pcify-server-windows.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcify-server-windows-zip-${{ github.run_number }}
          path: src/PcIfy.Server.Flutter/pcify-server-windows.zip
          retention-days: 30

      # Inno Setup installer — only produced on merges to main
      - name: Install Inno Setup
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: iscc windows\installer.iss

      - name: Upload installer artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pcify-server-windows-installer-${{ github.run_number }}
          path: src/PcIfy.Server.Flutter/Output/pcify-server-setup.exe
          retention-days: 30
