name: pcify_client
description: pc-ify Flutter client — local-network media browser.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Architecture / state
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.21.0

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.4.3

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # JWT decode
  dart_jsonwebtoken: ^2.8.1

  # Video player
  media_kit: ^1.1.11
  media_kit_video: ^1.1.11
  media_kit_libs_video: ^1.0.4

  # Image caching
  cached_network_image: ^3.3.1

  # File system / paths
  path_provider: ^2.1.3

  # External player
  android_intent_plus: ^4.0.3
  url_launcher: ^6.3.0

  # Biometric / device PIN authentication
  local_auth: ^3.0.0

  # Crypto (SHA-256 for folder prefs keys)
  crypto: ^3.0.3

  # Open downloaded files
  open_filex: ^4.4.1

  # File save / open dialog (backup & restore)
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
