name: pcify_server
description: pc-ify Flutter server — host media files on your local network.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1

  # HTTP server
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # Auth (same versions as client)
  dart_jsonwebtoken: ^2.8.1
  bcrypt: ^1.1.3

  # Storage / paths
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  path: ^1.9.0

  # File picking (SAF on Android)
  file_picker: ^8.1.2

  # Image thumbnails
  image: ^4.2.0

  # Video thumbnail extraction (Android/iOS — uses native APIs, no FFmpeg bundling)
  # video_thumbnail 0.5.x is abandoned and uses jcenter() (removed), incompatible with AGP 9+.
  # video_thumbnail_plus is the maintained fork with the same API.
  video_thumbnail_plus: ^1.0.4

  # Network info (local IP display)
  network_info_plus: ^6.0.0

  # Desktop tray + window management (Windows + macOS)
  tray_manager: ^0.2.3
  window_manager: ^0.3.9

  # Android foreground service
  flutter_foreground_task: ^8.14.0

  # HTTP client + ZIP extraction (FFmpeg binary download on Windows/macOS)
  http: ^1.2.0
  archive: ^3.6.0

  # Hashing (thumbnail cache keys)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
